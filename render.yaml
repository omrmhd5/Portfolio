services:
  - type: web
    name: omarmahmoud-analytics
    runtime: node
    region: frankfurt
    rootDir: analytics/server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://omarmahmoud.dev,https://www.omarmahmoud.dev,https://omarmahmoud-analytics.onrender.com,http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://127.0.0.1:3000
      - key: PORT
        value: 3000
